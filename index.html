<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>UNAM IMMERSIVE EXPERIENCE // Powered by VXR Core // Presented by PC PUMA</title>

  <!-- PWA & Meta Quest Browser Meta Tags -->
  <meta name="theme-color" content="#00172D" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Experiencia institucional WebXR de Ciudad Universitaria para Meta Quest y PC PUMA, impulsada por VXR Core." />

  <!-- Favicon y Branding -->
  <link rel="icon" type="image/png" href="./assets/branding/pcpuma-logo.png" />
  <link rel="manifest" href="./manifest.webmanifest" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #00172D;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #app {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Enlace discreto al panel de operador en la esquina superior */
    #operator-dock-link {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10000;
      background: rgba(7, 14, 26, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #94A3B8;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 9999px;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #operator-dock-link:hover {
      background: rgba(14, 165, 233, 0.2);
      border-color: #38BDF8;
      color: #FFFFFF;
    }

    #operator-dock-link .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10B981;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Botón discreto para abrir el panel de operador en una pestaña separada -->
  <a id="operator-dock-link" href="operador/" target="_blank" rel="noopener noreferrer">
    <span class="status-dot"></span>
    <span>Panel de Operador Stand</span>
  </a>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
